services:
  attendee-app-local:
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,attendee-app-local
      CUSTOM_ASYNC_TRANSCRIPTION_URL: http://host.docker.internal:8101/transcribe
      CUSTOM_ASYNC_TRANSCRIPTION_TIMEOUT: "600"
      REQUIRE_HTTPS_WEBHOOKS: "false"
      AWS_RECORDING_STORAGE_BUCKET_NAME: attendee-recordings
      AWS_ACCESS_KEY_ID: ATTENDEELOCAL
      AWS_SECRET_ACCESS_KEY: attendee-local-development
      AWS_ENDPOINT_URL: http://attendee-storage:9000
      AWS_S3_ADDRESSING_STYLE: path
    depends_on:
      attendee-storage-init:
        condition: service_completed_successfully
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  attendee-worker-local:
    environment:
      - CUSTOM_ASYNC_TRANSCRIPTION_URL=http://host.docker.internal:8101/transcribe
      - CUSTOM_ASYNC_TRANSCRIPTION_TIMEOUT=600
      - AWS_RECORDING_STORAGE_BUCKET_NAME=attendee-recordings
      - AWS_ACCESS_KEY_ID=ATTENDEELOCAL
      - AWS_SECRET_ACCESS_KEY=attendee-local-development
      - AWS_ENDPOINT_URL=http://attendee-storage:9000
      - AWS_S3_ADDRESSING_STYLE=path
    depends_on:
      attendee-storage-init:
        condition: service_completed_successfully
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 1024
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  attendee-scheduler-local:
    environment:
      AWS_RECORDING_STORAGE_BUCKET_NAME: attendee-recordings
      AWS_ACCESS_KEY_ID: ATTENDEELOCAL
      AWS_SECRET_ACCESS_KEY: attendee-local-development
      AWS_ENDPOINT_URL: http://attendee-storage:9000
      AWS_S3_ADDRESSING_STYLE: path
    depends_on:
      attendee-storage-init:
        condition: service_completed_successfully
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  attendee-webpage-streamer-local:
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256

  postgres:
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128

  redis:
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 64
